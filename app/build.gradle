
import com.android.build.api.variant.ResValue

plugins {
    id 'com.android.application'
}

def midletArchivesBaseName

// Release signing configuration.
// Values come from environment variables (CI) or from keystore.properties (local builds).
// Every release must be signed with the same key, otherwise Android refuses to install
// an update over the previous version.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String envName, String propName ->
    def value = System.getenv(envName)
    return value ? value : keystoreProps.getProperty(propName)
}
def releaseStoreFile = signingValue('SIGNING_STORE_FILE', 'storeFile')
def releaseStorePassword = signingValue('SIGNING_STORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signingValue('SIGNING_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('SIGNING_KEY_PASSWORD', 'keyPassword')
def hasReleaseKeystore = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def requireReleaseKey = System.getenv('REQUIRE_RELEASE_KEY') == 'true'

android {
    compileSdk COMPILE_SDK
    ndkVersion NDK_VERSION
    namespace 'ru.playsoftware.j2meloader'

    defaultConfig {
        applicationId "com.mesflit.j2mebloat"
        minSdk MIN_SDK
        targetSdk TARGET_SDK
        // Grows with every commit, so each CI build can be installed over the previous one.
        versionCode computeVersionCode()
        versionName "1.8.2"

        resValue 'string', 'app_name', rootProject.name

        vectorDrawables.useSupportLibrary = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    androidResources {
        generateLocaleConfig true
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                // Relative paths are resolved against the project root, absolute paths as is.
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            } else if (requireReleaseKey) {
                throw new GradleException(
                        'Release signing key is missing. See "Automatic releases" in README.md.')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true

            // Use custom signing key when available.
            // Otherwise, use Gradle's default debug key.
            signingConfig hasReleaseKeystore
                    ? signingConfigs.release
                    : signingConfigs.debug
        }

        debug {
            applicationIdSuffix '.debug'
            jniDebuggable true
            multiDexEnabled true
            multiDexKeepProguard file('multidex-config.pro')
        }
    }

    lint {
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    flavorDimensions 'default'

    productFlavors {
        play {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'

            versionNameSuffix "-play"
        }

        open {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'

            versionNameSuffix "-open"
        }

        fdroid {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'
        }

        dev {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'true'

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro', 'proguard-common.pro'

            versionNameSuffix "-dev-" + generateVersionCode()
        }

        // Variant dimension for creating an Android port from J2ME app source.
        midlet {
            buildConfigField 'boolean', 'FULL_EMULATOR', 'false'

            def props = getMidletManifestProperties()
            def midletName = props.getValue('MIDlet-Name').trim()
            def apkName = midletName.replaceAll('[/\\\\:*?"<>|]', '').replace(' ', '_')

            applicationId "com.example.androidlet.${apkName.toLowerCase()}"
            versionName = props.getValue('MIDlet-Version')

            resValue 'string', 'app_name', midletName

            midletArchivesBaseName = apkName

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-midlet.pro', 'proguard-common.pro'
        }
    }

    bundle {
        language {
            enableSplit = false
        }

        density {
            enableSplit = false
        }

        abi {
            enableSplit = true
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_21
        sourceCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        viewBinding true
        prefab true
        buildConfig true
        resValues true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->

        if (variant.buildType == 'debug' && variant.flavorName != 'midlet') {
            variant.resValues.put(
                    variant.makeResValueKey('string', 'app_name'),
                    new ResValue('J2ME-Bloat Debug', null)
            )
        }

        def baseName = variant.flavorName == 'midlet'
                ? "${midletArchivesBaseName}-"
                : "${rootProject.name}-"

        variant.outputs.each { output ->
            output.outputFileName.set(
                    output.versionName.map { versionName ->
                        "${baseName}${versionName}-${variant.buildType}.apk"
                                .replaceAll('--+', '-')
                                .replaceAll(' +', '_')
                    }
            )
        }
    }
}

static def generateVersionCode() {
    def result = "git rev-list HEAD --count".execute().text.trim()
    return result.toInteger()
}

static def computeVersionCode() {
    def env = System.getenv('VERSION_CODE')
    if (env) {
        return env.toInteger()
    }
    try {
        // Never go below the version code of the last manually numbered release.
        return Math.max(101, generateVersionCode())
    } catch (Exception ignored) {
        return 101
    }
}

def getMidletManifestProperties() {
    def file = project.file('src/midlet/resources/MIDLET-META-INF/MANIFEST.MF')
    def mf = new java.util.jar.Manifest()

    if (file.exists()) {
        def is = null

        try {
            is = new FileInputStream(file)
            mf.read(is)
        } finally {
            if (is != null) {
                is.close()
            }
        }
    }

    return mf.mainAttributes
}

dependencies {
    def roomVersion = '2.8.5'
    def cameraxVersion = "1.6.2"
    def autoServiceVersion = "1.1.1"

    implementation project(':dexlib')

    // Android Jetpack
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-rxjava2:$roomVersion"
    annotationProcessor "androidx.room:room-compiler:$roomVersion"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation "androidx.activity:activity:1.13.0"
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.preference:preference:1.2.1'

    // Networking && APIs
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.guava:guava:33.7.2-android'

    // Threads, Streams and Archives
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'

    // Audio/Video/Graphics
    implementation 'com.github.nikita36078:pngj:2.2.3'
    implementation 'io.github.nikita36078:ffmpeg-kit:6.0.LTS'
    implementation "com.google.oboe:oboe:1.11.0"

    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"

    // Android UI
    implementation 'com.github.nikita36078:filepicker:4.3.0'
    implementation 'com.github.yukuku:ambilwarna:2.0.1'

    // Testing && CrashReports
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'ch.acra:acra-dialog:5.14.2'

    def kotlinMetadataVersion = "2.4.21"

    annotationProcessor("org.jetbrains.kotlin:kotlin-metadata-jvm:$kotlinMetadataVersion")
    compileOnly "com.google.auto.service:auto-service-annotations:$autoServiceVersion"
    annotationProcessor "com.google.auto.service:auto-service:$autoServiceVersion"
}
