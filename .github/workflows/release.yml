name: Automated CI builds

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          # Full history: the version code is the number of commits.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Every APK must be signed with the SAME key, otherwise Android refuses to
      # install an update over the previous version. Without these secrets Gradle
      # would fall back to a random debug key created fresh on each runner.
      - name: Set up release signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Older setup: base64 keystore.properties (storeFile/storePassword/keyAlias/keyPassword)
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The SIGNING_KEY secret is missing. Follow 'Automatic releases' in README.md to add your signing key."
            exit 1
          fi

          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$SIGNING_KEY" | base64 -di > "$keystore"

          if [ -z "$KEY_STORE_PASSWORD" ] && [ -n "$KEYSTORE_PROPERTIES" ]; then
            props="$RUNNER_TEMP/keystore.properties"
            printf '%s' "$KEYSTORE_PROPERTIES" | base64 -di > "$props"
            read_prop() { grep -E "^[[:space:]]*$1[[:space:]]*=" "$props" | head -n1 | cut -d= -f2- | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
            KEY_STORE_PASSWORD="$(read_prop storePassword)"
            KEY_ALIAS="$(read_prop keyAlias)"
            KEY_PASSWORD="$(read_prop keyPassword)"
            rm -f "$props"
          fi

          if [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEY_STORE_PASSWORD and KEY_ALIAS secrets are required."
            exit 1
          fi

          # For PKCS12 keystores the key password equals the store password.
          [ -z "$KEY_PASSWORD" ] && KEY_PASSWORD="$KEY_STORE_PASSWORD"

          echo "::add-mask::$KEY_STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "SIGNING_STORE_FILE=$keystore"
            echo "SIGNING_STORE_PASSWORD=$KEY_STORE_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            echo "REQUIRE_RELEASE_KEY=true"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDevRelease

      - name: Collect APK and verify signature
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/dev/release/*.apk dist/

          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          for apk in dist/*.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            echo "$certs"
            if echo "$certs" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is signed with a debug key. Updates would not install."
              exit 1
            fi
            {
              echo "### $(basename "$apk")"
              echo '```'
              echo "$certs" | grep -E "SHA-256 digest|DN:"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          ls -lh dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Move continuous tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="repos/$GITHUB_REPOSITORY/git"

          if gh api "$base/ref/tags/continuous" >/dev/null 2>&1; then
            gh api -X PATCH "$base/refs/tags/continuous" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          else
            gh api -X POST "$base/refs" \
              -f ref="refs/tags/continuous" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Update GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: continuous
          commit: ${{ github.sha }}
          name: Automated CI builds
          body: |
            Automated build of the latest commit on master.

            Every build is signed with the same release key, so it installs as an
            update over the previous one — your games and settings are kept.
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "dist/*.apk"
