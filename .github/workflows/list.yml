
name: Generate J2ME Game List

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate complete game list
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          games_dir = Path("app/src/main/assets/games")
          games = sorted(
              games_dir.glob("*.jar"),
              key=lambda p: p.name.casefold()
          )

          lines = [
              "# J2ME-Bloat - Complete Game List",
              "",
              f"**Total JAR files: {len(games):,}**",
              "",
              "This list is generated automatically from the bundled JAR files.",
              "Different versions, resolutions and regional releases may appear separately.",
              "",
              "## Games",
              ""
          ]

          for index, game in enumerate(games, 1):
              name = game.stem
              name = re.sub(r"^[0-9a-f]{12}_", "", name)
              lines.append(f"{index}. {name}")

          Path("GAMES.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(f"Generated game list with {len(games)} JAR files.")
          PY

      - name: Commit game list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add GAMES.md

          if ! git diff --cached --quiet; then
            git commit -m "Update complete J2ME game list"
            git push
          else
            echo "Game list is already up to date."
          fi
